version: '3.8'

services:
  web:
    build: .
    container_name: fastapi_yolo_app
    restart: always
    volumes:
      - ./uploads:/app/uploads # Чтобы загруженные видео сохранялись на диске сервера
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web